services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD}
      BFF_DB_PASSWORD: ${BFF_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - oauth-lab-postgres:/var/lib/postgresql/data
      - ./docker/postgres/001-init.sh:/docker-entrypoint-initdb.d/001-init.sh:ro

volumes:
  oauth-lab-postgres:
