<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Refresh Token familyとDB遷移</title></head>
<body class="m-0 h-canvas w-canvas overflow-hidden bg-canvas text-ink" role="img" aria-label="Refresh Token familyが交換ごとに新recordへ進み古いTokenの再利用を拒否する図">
<main class="flex h-full w-full flex-col p-8"><header><p data-text-role="label" class="text-base font-black uppercase tracking-widest text-warning">Rotation state</p><h1 class="mt-2 text-4xl font-black">Token familyは前へ進み、古い枝へ戻れない</h1><p class="mt-2 text-lg font-semibold text-muted">refreshTokenReuseInterval=0：成功した交換直後から旧Tokenを拒否。</p></header>
<section class="mt-8 flex min-h-0 flex-1 items-center justify-center gap-4">
<article class="w-64 rounded-3xl border-2 border-line bg-surface p-6 text-center"><p class="text-lg font-black text-muted">GENERATION 1</p><h2 class="mt-3 text-3xl font-black">RT-1</h2><p class="mt-4 text-lg font-semibold">status: used</p></article><div class="text-4xl font-black text-primary">→</div>
<article class="w-64 rounded-3xl border-2 border-primary bg-primary-soft p-6 text-center"><p class="text-lg font-black text-primary-strong">GENERATION 2</p><h2 class="mt-3 text-3xl font-black">RT-2</h2><p class="mt-4 text-lg font-semibold">status: used</p></article><div class="text-4xl font-black text-success">→</div>
<article class="w-64 rounded-3xl border-2 border-success bg-success-soft p-6 text-center"><p class="text-lg font-black text-success">GENERATION 3</p><h2 class="mt-3 text-3xl font-black">RT-3</h2><p class="mt-4 text-lg font-semibold">status: active</p></article>
</section><footer class="mt-6 grid grid-cols-2 gap-5"><div class="rounded-2xl border-2 border-success bg-success-soft p-4 text-center text-xl font-black text-success">RT-3を交換 → 次世代を1件だけ作る</div><div class="rounded-2xl border-2 border-danger bg-danger-soft p-4 text-center text-xl font-black text-danger">RT-1 / RT-2をreuse → family compromise signal</div></footer></main></body></html>
