<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ID Token validation</title></head>
<body class="m-0 h-canvas w-canvas overflow-hidden bg-canvas text-ink" role="img" aria-label="ID Tokenをalgorithmからsignature、issuer、audience、nonce、at_hashの順に検証する図">
<main class="flex h-full w-full flex-col p-8"><header><p data-text-role="label" class="text-base font-black uppercase tracking-widest text-primary-strong">Validation pipeline</p><h1 class="mt-2 text-4xl font-black">decodeできても、全検証が終わるまでは未検証</h1><p class="mt-2 text-lg font-semibold text-muted">Better Auth 1.7.1既定：EdDSA、at_hashはSHA-512の左半分。</p></header>
<section class="mt-7 grid min-h-0 flex-1 grid-cols-4 gap-4"><article class="rounded-3xl border-2 border-primary bg-primary-soft p-5"><p class="text-lg font-black text-primary-strong">1　HEADER</p><h2 class="mt-3 text-2xl font-black">alg allowlist</h2><p class="mt-3 text-lg font-semibold">kidでJWKS鍵を選ぶ</p></article><article class="rounded-3xl border-2 border-accent bg-accent-soft p-5"><p class="text-lg font-black text-accent-strong">2　JWS</p><h2 class="mt-3 text-2xl font-black">signature</h2><p class="mt-3 text-lg font-semibold">AS公開鍵で検証</p></article><article class="rounded-3xl border-2 border-secondary bg-secondary-soft p-5"><p class="text-lg font-black text-secondary-strong">3　CLAIMS</p><h2 class="mt-3 text-2xl font-black">iss + aud + exp</h2><p class="mt-3 text-lg font-semibold">AS・Client・時刻</p></article><article class="rounded-3xl border-2 border-success bg-success-soft p-5"><p class="text-lg font-black text-success">4　BINDING</p><h2 class="mt-3 text-2xl font-black">nonce + at_hash</h2><p class="mt-3 text-lg font-semibold">transactionとAccess Token</p></article></section><footer class="mt-6 flex items-center justify-center gap-5"><span class="rounded-full bg-warning-soft px-6 py-4 text-xl font-black text-warning">途中：verified = false</span><span class="text-4xl font-black text-success">→</span><span class="rounded-full bg-success px-6 py-4 text-xl font-black text-on-primary">全条件通過：verified = true</span></footer></main></body></html>
